<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — URL Checker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        [data-theme="dark"] {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --text-secondary: #8b949e;
            --text-dim: #6e7681;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --red: #f85149;
            --red-bg: #1f0c0c;
            --shadow: 0 4px 12px rgba(0,0,0,0.4);
        }
        [data-theme="light"] {
            --bg: #f4f5f7;
            --surface: #ffffff;
            --border: #dfe1e6;
            --text: #172b4d;
            --text-secondary: #5e6c84;
            --text-dim: #97a0af;
            --accent: #0052cc;
            --accent-hover: #0747a6;
            --red: #de350b;
            --red-bg: #ffebe6;
            --shadow: 0 4px 12px rgba(9,30,66,0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }
        .login-card .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .google-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 28px;
            font-size: 14px;
            font-weight: 600;
            background: var(--surface);
            color: var(--text);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s;
        }
        .google-btn:hover {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(88,166,255,0.15);
        }
        .google-btn svg {
            width: 18px;
            height: 18px;
        }

        .error-msg {
            background: var(--red-bg);
            color: var(--red);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .login-footer {
            margin-top: 28px;
            font-size: 12px;
            color: var(--text-dim);
        }
        .login-logo { height: 60px; margin-bottom: 24px; }
        [data-theme="light"] .login-logo { filter: invert(1) hue-rotate(180deg); }
    </style>
</head>
<body>
    <div class="login-card">
        <img class="login-logo" src="{{ url_for('static', filename='logo.png') }}" alt="Moore County Schools">
        <h1>URL Checker</h1>
        <p class="subtitle">Sign in with your school account to continue</p>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <a href="{{ url_for('auth.login_google') }}" class="google-btn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Sign in with Google
        </a>

        <div class="login-footer">
            Restricted to authorized staff only
        </div>
    </div>

    <script>
        const theme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
    </script>
</body>
</html>
